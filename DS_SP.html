<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Sản Phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            max-width: 600px;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px 12px;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <!-- Tiêu đề <h1> -->
    <h1>Danh sách sản phẩm</h1>

    <!-- Bảng danh sách sản phẩm dùng các thẻ <table>, <tr>, <th>, <td> -->
    <table>
        <thead>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Áo thun nam</td>
                <td>150.000 VNĐ</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Quần jean nữ</td>
                <td>350.000 VNĐ</td>
                <td>15</td>
            </tr>
            <tr>
                <td>Giày thể thao</td>
                <td>500.000 VNĐ</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Mũ bảo hiểm</td>
                <td>200.000 VNĐ</td>
                <td>30</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
